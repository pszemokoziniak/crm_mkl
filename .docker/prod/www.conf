; Pula HRM. Kontener działa w sieci hosta, więc nginx hosta łączy się
; z 127.0.0.1:9081, a aplikacja z MySQL hosta przez 127.0.0.1:3306.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9081

; Jak na hoście: serwer ma 1,9 GB RAM.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Logi żądań wyłączone (nginx je ma); błędy PHP idą do `docker logs`.
access.log = /dev/null
catch_workers_output = yes
