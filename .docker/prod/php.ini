; Te same limity co PHP-FPM na hoście przed przejściem na kontener.
memory_limit = 128M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 30
max_input_vars = 1000
date.timezone = Europe/Warsaw
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
; Kod jest podpięty z hosta, więc po git pull zmiany mają wejść same.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
