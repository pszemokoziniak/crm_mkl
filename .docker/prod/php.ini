; Te same limity co PHP-FPM na hoście przed przejściem na kontener.
memory_limit = 128M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 30
max_input_vars = 1000
date.timezone = Europe/Warsaw
expose_php = Off

; Obraz php:*-fpm nie ma produkcyjnego php.ini, więc domyślnie display_errors
; jest włączone. Laravel wyłącza je dopiero po starcie — błąd z rozruchu
; pokazałby ścieżki na stronie. Tak jak na hoście: błędy tylko do logu.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

opcache.enable = 1
opcache.memory_consumption = 128
; Kod jest podpięty z hosta, więc po git pull zmiany mają wejść same.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
